spring.application.name=task-management


# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# Database - MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/task_management?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


jwt.secret=mysecretkeymysecretkeymysecretkey12345
jwt.access.expiration=3600000 # 1 hour in milliseconds




